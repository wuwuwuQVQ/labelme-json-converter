name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
          - runner: ubuntu-22.04
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip .

      - name: Install Linux GUI test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tk

      - name: Run tests on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Run core diagnostic
        run: python -m labelme_json_converter --self-test

      - name: Run GUI diagnostic on Windows and macOS
        if: runner.os != 'Linux'
        run: python -m labelme_json_converter --ui-smoke-test

      - name: Run GUI diagnostic on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m labelme_json_converter --ui-smoke-test
